version: '3'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:6.2.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:6.2.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:29092"
      JVM_OPTS: "-Xms64M -Xmx128M"
      SERVER_SERVLET_CONTEXTPATH: "/"
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure

  minio:
    image: minio/minio:latest
    ports:
      - "9001:9000"  # S3 API
      - "9002:9001"  # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      # Используем bind mount вместо именованного тома
      - ./data:/var/lib/postgresql/data
      # - ./backups:/backups
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    ports:
      - "2379:2379"
    restart: unless-stopped

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.3.3
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_NAME: "milvus-bucket"
    volumes:
      - ./vector_db:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.3.5
    ports:
      - "8123:3000"
    environment:
      - MILVUS_URL=milvus-standalone:19530
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped

  triton:
    image: nvcr.io/nvidia/tritonserver:23.10-py3
    container_name: triton_yolo
    command: tritonserver --model-repository=/models --strict-model-config=false --log-verbose=1
    volumes:
      - ./backend/triton_models:/models
      - ./model_cache:/tmp/triton
    ports:
      - "8010:8000"  # HTTP
      - "8011:8001"  # gRPC
      - "8012:8002"  # Metrics
    shm_size: 2gb

    runtime: nvidia
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=0

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: diploma-frontend
    ports:
      - "3000:3000"  # Порт для доступа к фронтенду
    environment:
      - REACT_APP_API_URL=http://backend:8000  # URL бэкенда
      - REACT_APP_WS_URL=ws://backend:8000/ws  # WebSocket если есть
    # depends_on:
    #   - backend  # Если бэкенд в Docker
    restart: unless-stopped

  backend:
    # build:
    #   context: ./backend
    #   dockerfile: Dockerfile
    image: backend:3
    container_name: diploma-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # Для разработки с горячей перезагрузкой
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      milvus:
        condition: service_healthy
      minio:
        condition: service_healthy
      triton:
        condition: service_started
    restart: unless-stopped

volumes:
  kafka-data:
  minio-data:
  postgres_data:
  etcd-data:
  milvus-data:
