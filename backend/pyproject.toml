[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle ошибки
    "F",     # Pyflakes (неиспользуемые импорты/переменные)
    "I",     # isort (сортировка импортов)
    "UP",    # pyupgrade (современный синтаксис для Python 3.11+)
    "B",     # flake8-bugbear (ловим скрытые баги)
    "C4",    # flake8-comprehensions (улучшаем генераторы списков)
    "SIM",   # flake8-simplify (упрощаем код)
    "PLC",   # Pylint логические ошибки
    "PLE",   # Pylint ошибки
    "PLW",   # Pylint предупреждения
    "RUF",   # Специфичные правила Ruff
]

ignore = [
    "E501",      # Длина строки (за это отвечает ruff format)
    "B008",      # Call-выражения в аргументах по умолчанию (нужно для FastAPI Depends)
    "S101",      # Использование assert (разрешено в тестах)
    "RUF001",   # Буквы о
    "RUF002",   # Буквы а
    "RUF003"    # Буквы e
]

[tool.ruff.lint.pylint]
max-args = 10           # Максимум аргументов функции
max-returns = 6         # Максимум return выражений
max-branches = 20       # Максимум ветвлений
max-statements = 80     # Максимум выражений в функции

[tool.ruff.lint.isort]
lines-after-imports = 2
lines-between-types = 1
force-single-line = false
force-sort-within-sections = true
order-by-type = true
known-first-party = ["backend", "app"]  # Укажите название вашего пакета
known-third-party = [
    "fastapi",
    "sqlalchemy",
    "pydantic"
]

section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",      # assert в тестах
    "PLR2004",   # Магические числа в тестах
    "B011"      # Пустые except в тестах
]

[tool.ruff.format]
quote-style = "double"        # Используем двойные кавычки
indent-style = "space"        # Пробелы для отступов
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
    "httpx>=0.24.0,<0.29.0",
    "mypy>=1.13.0",
    "requests>=2.33.1",
    "starlette>=0.27.0,<0.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "starlette==0.27.0",
    "pre-commit==4.0.1",  # Добавить
    "mypy==1.13.0",        # Для проверки типов
    "bandit==1.7.10",      # Для безопасности
]
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "alembic/",
    "migrations/",
]
